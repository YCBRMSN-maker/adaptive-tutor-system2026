<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sync-PBL学习平台 - 课程选择</title>
  <link rel="stylesheet" href="../css/styles.css">
  <!-- Iconify图标库 -->
  <script src="../js/modules/iconify-icon.min.js"></script>
</head>

<body>
  <div class="main-container">
    <!-- 顶部标题栏 -->
    <header class="top-header page-header">
      <h1 class="header-title" id="headerTitle">sync-PBL学习平台</h1>
      <div class="header-actions">
        <!-- 当前登录用户 -->
        <span class="user-chip" id="user-chip" title="当前登录用户">
          <iconify-icon icon="mdi:account-circle" width="18" height="18"></iconify-icon>
          <span id="user-nickname">同学</span>
        </span>
        <!-- 退出登录 -->
        <button type="button" id="logout-button" class="logout-button" title="退出登录" aria-label="退出登录">
          <iconify-icon icon="mdi:logout" width="18" height="18"></iconify-icon>
          <span>退出登录</span>
        </button>
        <!-- 中英文切换按钮 -->
        <button id="language-toggle" class="back-button">
          <iconify-icon icon="mdi:translate" width="20" height="20"></iconify-icon>
          EN
        </button>
      </div>
    </header>

    <!-- 内容区域 -->
    <div class="content-container page-fill">
      <div class="index-container panel">
        <div class="panel-header">
          <iconify-icon icon="mdi:sparkles" width="24" height="24"></iconify-icon>
          <h2>欢迎使用sync-PBL学习平台</h2>
        </div>

        <!-- 课程选择 -->
        <div class="entry-container course-selection-container">
          <div class="course-selection-content">
            <!-- 欢迎区域 -->
            <div class="welcome-section">
              <iconify-icon icon="mdi:school" width="64" height="64" class="welcome-icon"></iconify-icon>
              <h2>选择你的课程</h2>
              <p>选择一门课程作为学习方向，AI 会结合课程与你的学习偏好生成专属方案。</p>
            </div>

            <!-- 课程列表（由 courseSelectionPage.js 渲染） -->
            <div id="course-grid" class="course-grid" role="radiogroup" aria-label="课程列表" aria-required="true"></div>

            <!-- 操作区域 -->
            <div class="course-selection-footer">
              <p id="course-selection-tip" class="course-selection-tip" role="status" aria-live="polite">请选择一门课程</p>
              <button type="button" id="course-confirm-button" class="start-button course-confirm-button" disabled>
                <iconify-icon icon="mdi:rocket-launch" width="20" height="20"></iconify-icon>
                进入课程
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 引入课程选择页面逻辑 -->
  <script type="module" src="../js/pages/courseSelectionPage.js"></script>
</body>

</html>
