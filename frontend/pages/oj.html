<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sync-PBL学习平台 - 算法练习</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/oj.css">
  <link rel="stylesheet" href="../css/oj-practice.css">
  <!-- Monaco Editor（本地 vendor，与主站测试页同一份） -->
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="/js/vendor/monaco/vs/editor/editor.main.css">
  <script src="../js/modules/iconify-icon.min.js"></script>
</head>

<body class="oj-page oj-practice-page">
  <div class="main-container">
    <!-- 顶部标题栏：结构与主站 test_page 一致 -->
    <header class="top-header-lean">
      <h1 class="header-title" id="headerTitle">
        <span id="problemTitle">加载中…</span>
      </h1>
      <div class="user-profile">
        <span class="oj-progress" id="ojProgress"></span>
        <button class="back-button" id="chatToggleBtn" title="显示/隐藏 AI 助教">
          <iconify-icon icon="mdi:robot-happy-outline" width="20" height="20"></iconify-icon>
          AI 助教
        </button>
        <button class="back-button" id="backButton">
          <iconify-icon icon="mdi:arrow-left" width="20" height="20"></iconify-icon>
          返回
        </button>
        <iconify-icon icon="mdi:account-circle" width="36" height="36"></iconify-icon>
      </div>
    </header>

    <!-- 三栏：题目要求+结果 / 编辑器 / 修改建议 -->
    <div class="content-container oj-practice-layout" id="ojLayout">

      <!-- 左栏 -->
      <div class="left-panel">
        <div class="panel oj-problem-panel" id="problemPane">
          <div class="panel-header">
            <div class="oj-panel-title">
              <iconify-icon icon="mdi:clipboard-list" width="18" height="18"></iconify-icon>
              <h2>题目要求</h2>
            </div>
            <span class="oj-panel-meta" id="problemMeta"></span>
          </div>
          <div class="panel-content oj-problem-body" id="problemBody">
            <div class="oj-empty">
              <iconify-icon icon="mdi:file-document-outline" width="42" height="42"></iconify-icon>
              <p>请从算法学习页选择一道题</p>
            </div>
          </div>
          <!-- 与主站 test_page 一致的解题思路入口 -->
          <div class="panel-footer">
            <button id="problem-solving-hint-btn" class="btn btn-primary">
              <iconify-icon icon="mdi:lightbulb-on-outline" width="18" height="18"></iconify-icon>
              给点灵感
            </button>
          </div>
        </div>

        <div class="panel oj-result-panel">
          <div class="panel-header">
            <div class="oj-panel-title">
              <iconify-icon icon="mdi:chart-box" width="18" height="18"></iconify-icon>
              <h2>测试结果</h2>
            </div>
          </div>
          <div class="panel-content oj-result-body" id="resultPanel">
            <div class="oj-result-placeholder">
              <iconify-icon icon="mdi:progress-clock" width="32" height="32"></iconify-icon>
              <p>写好代码后点击提交，稍等就会出现测试结果</p>
            </div>
          </div>
          <div class="panel-footer oj-result-footer" id="aiDiagFooter" style="display: none;">
            <button class="oj-btn oj-btn-primary" id="aiDiagBtn">
              <iconify-icon icon="mdi:robot" width="16" height="16"></iconify-icon>
              <span id="aiDiagText">AI 定位</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 中栏 -->
      <div class="panel mid-panel oj-editor-panel" id="ojWorkspace">
        <div class="panel-header">
          <h2>编辑器</h2>
          <div class="oj-editor-tools">
            <select id="languageSelect" class="oj-select">
              <option value="C">C</option>
              <option value="C++">C++</option>
              <option value="Python3">Python 3</option>
            </select>
            <button class="oj-btn" id="resetBtn" title="恢复初始模板">重置</button>
          </div>
        </div>
        <div class="oj-editor">
          <div id="monacoEditor" class="oj-monaco"></div>
        </div>
        <!-- 提交按钮放在编辑器底部，与主站 test_page 一致 -->
        <div class="editor-actions">
          <button id="submitBtn" class="btn btn-secondary">
            <iconify-icon icon="mdi:check-all" width="16" height="16"></iconify-icon>
            提交
          </button>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="panel chat-panel oj-chat-panel" id="ojChat">
        <div class="panel-header">
          <div class="oj-panel-title">
            <iconify-icon icon="mdi:lightbulb-on" width="18" height="18"></iconify-icon>
            <h2>修改建议</h2>
          </div>
          <button class="oj-icon-btn" id="chatCloseBtn" title="收起">
            <iconify-icon icon="mdi:chevron-right" width="18" height="18"></iconify-icon>
          </button>
        </div>
        <div class="chat-history">
          <div class="ai-chat-messages" id="ai-chat-messages">
            <div class="ai-message">
              <div class="ai-avatar">
                <iconify-icon icon="mdi:robot" width="18" height="18"></iconify-icon>
              </div>
              <div class="ai-content">
                遇到问题可以问我，我会先给提示，引导你自己想出来，不直接给答案。
              </div>
            </div>
          </div>
          <div class="ai-chat-input">
            <textarea id="user-message" placeholder="在这里输入你的问题..."></textarea>
            <button type="button" id="send-message" class="btn btn-primary">
              <iconify-icon icon="mdi:send" width="16" height="16"></iconify-icon>
              提问
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Monaco loader：必须先于 ojPage.js 加载，模块里用 require 初始化编辑器 -->
  <script src="/js/vendor/monaco/vs/loader.js"></script>
  <script>
    require.config({ paths: { 'vs': '/js/vendor/monaco/vs' } });
  </script>
  <script type="module" src="../js/pages/ojPage.js"></script>
</body>

</html>
