
services:
  # Redis服务
  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack-integration
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-backend
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - BACKEND_PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
      - backend_data:/app/backend/app/db
    depends_on:
      - redis
    restart: unless-stopped

  # Celery Chat Worker
  celery-chat-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-celery-chat-worker
    env_file: .env
    command: celery -A app.celery_app worker -l info -Q chat_queue --pool=prefork -n ai_worker@%h -c 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Celery Submission Worker
  celery-submit-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-celery-submit-worker
    env_file: .env
    command: celery -A app.celery_app worker -l info -Q submit_queue --pool=prefork -n submit_worker@%h -c 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Celery DB Writer Worker
  celery-db-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-celery-db-worker
    env_file: .env
    command: celery -A app.celery_app worker -l info -Q db_writer_queue --pool=gevent -n db_worker@%h -c 10
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Celery Behavior Worker
  celery-behavior-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-celery-behavior-worker
    env_file: .env
    command: celery -A app.celery_app worker -l info -Q behavior_queue --pool=prefork -n behavior_worker@%h -c 2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # Celery Beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ats-exp-celery-beat
    env_file: .env
    command: celery -A app.celery_app beat -l info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./app/db/database.db

    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  # 在线判题系统（SyncOJ 后端）—— 独立容器
  # 不并入主 backend 的理由是安全隔离，，判题要执行学生提交的不可信代码
  # （死循环 / fork 炸弹 / 超大 malloc），靠容器边界 + 下面的资源上限把爆炸半径限制在这一个容器里。
  # 顺带说明：主 backend 镜像（Dockerfile.backend:19-22）本来就装了 g++ 和 make。
  oj-backend:
    build:
      context: ./backend/oj
      dockerfile: Dockerfile
    container_name: ats-oj-backend
    ports:
      - "8001:8000"
    environment:
      # 复用主站 .env 里的 TUTOR_OPENAI_* 配置，避免两处填同一个 key
      - DEEPSEEK_API_KEY=${TUTOR_OPENAI_API_KEY:-}
      # 主站的 TUTOR_OPENAI_MODEL 是推理模型（content 为空，内容在 reasoning_content），
      # OJ 的解析只取 content，所以这里单独用对话模型
      - DEEPSEEK_MODEL=${OJ_DEEPSEEK_MODEL:-deepseek-chat}
      - DEEPSEEK_BASE_URL=${TUTOR_OPENAI_API_BASE:-https://api.deepseek.com}
    volumes:
      - oj_data:/app/data
    # 资源上限：判题被打爆时只影响这个容器，不会把宿主机和主站拖下水。
    # 容量参考：单次判题的学生进程 RLIMIT_AS=256MB，gcc 编译峰值约 200~300MB，
    # 2g 大约够 4~6 路并发提交；并发再高就调大 mem_limit / cpus。
    mem_limit: 2g
    memswap_limit: 2g      # 不给 swap：超限直接 OOM kill，而不是让整台机器卡住
    cpus: 2
    pids_limit: 256        # 容器级进程数兜底（进程内另有 RLIMIT_NPROC=64 防线）
    restart: unless-stopped

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: atx-exp-frontend
    ports:
      - "8325:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  backend_data:
  oj_data: